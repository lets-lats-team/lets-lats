# 로컬 개발 환경: PostgreSQL 17과 S3 호환 저장소(MinIO)
# 저장소 루트에서 실행한다:
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d --wait
# 이미지는 버전과 digest로 고정한다. PostgreSQL은 17의 최신 마이너 버전을 쓰고 새 마이너가 나오면 올린다.
# 공식 MinIO 이미지는 배포가 끝나 Chainguard 빌드를 쓴다.
name: latser

services:
  db:
    image: postgres:17.12@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?.env에 POSTGRES_DB가 필요하다}
      POSTGRES_USER: ${POSTGRES_USER:?.env에 POSTGRES_USER가 필요하다}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD가 필요하다}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    image: cgr.dev/chainguard/minio@sha256:f6243be11aaaa2fe654d260558e2b3fcef50135e78a3abfd0db802b13444f059
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?.env에 MINIO_ROOT_USER가 필요하다}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?.env에 MINIO_ROOT_PASSWORD가 필요하다}
      S3_BUCKET: ${S3_BUCKET:?.env에 S3_BUCKET이 필요하다}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      # 버킷까지 있어야 healthy로 본다. 끝나는 초기화 컨테이너를 두면 up --wait가 실패로 처리한다
      test:
        - CMD-SHELL
        - >-
          export MC_HOST_local="http://$${MINIO_ROOT_USER}:$${MINIO_ROOT_PASSWORD}@localhost:9000" &&
          mc --config-dir /tmp/.mc ready local &&
          mc --config-dir /tmp/.mc mb --ignore-existing "local/$${S3_BUCKET}"
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  db-data:
  s3-data:
